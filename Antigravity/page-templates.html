<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templates — Corvus (Design Preview)</title>
  <meta name="description" content="Corvus templates design preview. Example data only.">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { background: #000000; }
    body {
      color: #ffffff;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .strip {
      font-family: 'Geist Mono', ui-monospace, monospace;
      text-align: center; font-size: 12px; padding: 8px 16px;
      color: #8a8a93; background: #000000; border-bottom: 1px solid #1c1c20;
    }
    .shell { display: flex; min-height: calc(100vh - 34px); background: #000000; }
    .rail {
      width: 240px; flex: none; background: #000000;
      border-right: 1px solid #1c1c20; padding: 16px 12px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .workspace { display: flex; align-items: center; gap: 8px; padding: 4px 8px; min-width: 0; }
    .avatar {
      width: 28px; height: 28px; flex: none; border-radius: 50%;
      background: #262626; color: #fafafa; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 13px; line-height: 20px; font-weight: 600;
    }
    .workspaceName {
      font-size: 14px; line-height: 20px; font-weight: 500; color: #ffffff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .proPill {
      margin-left: auto; flex: none; font-size: 12px; line-height: 16px; font-weight: 500;
      padding: 2px 10px; border-radius: 999px;
      border: 1px solid #2a2a30; background: #111111; color: #c9d1d9;
    }
    .navList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .navItem {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 12px; border-radius: 999px; background: transparent;
      color: #8a8a93; font-size: 14px; line-height: 20px; font-weight: 500;
      text-align: left; text-decoration: none; cursor: pointer; border: none;
      transition: background-color 200ms cubic-bezier(0.32,0.72,0,1), color 200ms cubic-bezier(0.32,0.72,0,1);
    }
    .navItem:hover { background: #111111; color: #ffffff; }
    .navItem[aria-current='page'] { background: #262626; color: #fafafa; }
    .navItem svg { width: 16px; height: 16px; flex: none; }
    .railFoot {
      margin-top: auto; display: flex; flex-direction: column; gap: 8px;
      border-top: 1px solid #1c1c20; padding: 16px 8px 0;
    }
    .creditsLine { margin: 0; color: #c9d1d9; font-size: 13px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .meterTrack { height: 4px; border-radius: 999px; background: #262626; overflow: hidden; }
    .meterFill { height: 100%; width: 82%; border-radius: inherit; background: #ffffff; }
    .upgrade {
      align-self: flex-start; padding: 6px 16px; border-radius: 999px;
      border: 1px solid #2a2a30; background: #262626; color: #fafafa;
      font-size: 13px; line-height: 20px; font-weight: 500; cursor: pointer;
      transition: background-color 200ms cubic-bezier(0.32,0.72,0,1), border-color 200ms cubic-bezier(0.32,0.72,0,1);
    }
    .upgrade:hover { background: #111111; border-color: #8a8a93; }
    .footLink { color: #8a8a93; font-size: 13px; line-height: 20px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
    .footLink:hover { color: #ffffff; }
    .content { flex: 1; min-width: 0; position: relative; isolation: isolate; background: #000000; display: flex; flex-direction: column; }
    .ambient { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .ambientGlowTop {
      position: absolute; top: -200px; left: -60px; width: 640px; height: 560px;
      background: radial-gradient(ellipse, rgb(255 255 255 / 0.05), transparent 65%); pointer-events: none;
    }
    .ambientGlowBottom {
      position: absolute; right: -180px; bottom: -180px; width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgb(255 255 255 / 0.03), transparent 65%); pointer-events: none;
    }
    .col { position: relative; z-index: 1; width: 100%; max-width: 1600px; margin: 0 auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; }
    .listTitle { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0; color: #ffffff; }
    .countsLine { margin: 0; color: #8a8a93; font-size: 13px; line-height: 20px; font-variant-numeric: tabular-nums; }
    .searchWrap {
      position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px;
      padding: 8px; border-radius: 16px; background: rgb(255 255 255 / 0.08);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.1);
      -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
    }
    .searchLabel { color: #8a8a93; font-size: 13px; line-height: 20px; font-weight: 500; }
    .search {
      height: 40px; padding: 0 16px; border-radius: 999px;
      border: 1px solid #1c1c20; background: #111111; color: #ffffff;
      font-size: 14px; line-height: 20px; width: 100%;
      transition: border-color 200ms cubic-bezier(0.32,0.72,0,1);
    }
    .search::placeholder { color: #8a8a93; }
    .search:hover { border-color: #2a2a30; }
    .catPills { display: flex; gap: 4px; flex-wrap: wrap; }
    .tab {
      padding: 6px 14px; border-radius: 999px; border: 1px solid transparent; background: transparent;
      color: #8a8a93; font-size: 13px; line-height: 20px; font-weight: 500; cursor: pointer;
      transition: background-color 200ms cubic-bezier(0.32,0.72,0,1), color 200ms cubic-bezier(0.32,0.72,0,1), border-color 200ms cubic-bezier(0.32,0.72,0,1);
    }
    .tab:hover { background: #111111; color: #ffffff; }
    .tab[aria-pressed='true'] { background: #262626; border-color: #2a2a30; color: #fafafa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 16px; }
    .grid > * { min-width: 0; }
    .card {
      background: #0d0d10; border: 1px solid #1c1c20; border-radius: 16px;
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .cardTop { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .cardTitle { margin: 0; color: #ffffff; font-size: 15px; line-height: 24px; font-weight: 600; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px; flex: none;
      font-size: 13px; line-height: 20px; font-weight: 500;
      padding: 3px 12px 3px 10px; border-radius: 999px;
      border: 1px solid #2a2a30; background: #111111; color: #c9d1d9; white-space: nowrap;
    }
    .cardDesc { margin: 0; color: #8a8a93; font-size: 14px; line-height: 20px; }
    .ghostAction {
      display: inline-flex; align-items: center; justify-content: center; align-self: flex-start;
      padding: 8px 16px; border-radius: 999px; border: 1px solid #2a2a30;
      color: #fafafa; background: transparent; text-decoration: none;
      font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; cursor: pointer;
      transition: background-color 200ms cubic-bezier(0.32,0.72,0,1), border-color 200ms cubic-bezier(0.32,0.72,0,1);
    }
    .ghostAction:hover { background: #111111; border-color: #8a8a93; }
    .empty {
      margin: 0; padding: 24px 20px; background: #0d0d10;
      border: 1px solid #2a2a30; border-radius: 16px;
      display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
    }
    .emptyText { margin: 0; color: #ffffff; font-size: 15px; line-height: 24px; font-weight: 500; }
    .shell button:focus-visible, .shell input:focus-visible, .shell a:focus-visible {
      outline: 2px solid #3cc0ae; outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .shell *, .shell *::before { transition: none; }
      .ambient { display: none; }
      .searchWrap { background: #0d0d10; -webkit-backdrop-filter: none; backdrop-filter: none; -webkit-mask-image: none; mask-image: none; }
    }
    @media (max-width: 900px) {
      .shell { flex-direction: column; }
      .rail { width: auto; border-right: none; border-bottom: 1px solid #1c1c20; }
      .railFoot { margin-top: 0; }
      .col { padding: 16px; }
    }
  </style>
</head>
<body>
  <p class="strip">Design preview - example data.</p>
  <div class="shell">
    <nav aria-label="Primary" class="rail">
      <div class="workspace">
        <span aria-hidden="true" class="avatar">M</span>
        <span class="workspaceName">My server</span>
        <span class="proPill">Pro</span>
      </div>
      <ul class="navList">
        <li><a class="navItem" href="page-bots.html"><i data-lucide="bot" aria-hidden="true"></i>Bots</a></li>
        <li><a class="navItem" href="page-templates.html" aria-current="page"><i data-lucide="layout-template" aria-hidden="true"></i>Templates</a></li>
        <li><a class="navItem" href="page-interview.html"><i data-lucide="messages-square" aria-hidden="true"></i>Interview</a></li>
        <li><a class="navItem" href="page-activity.html"><i data-lucide="activity" aria-hidden="true"></i>Activity</a></li>
        <li><a class="navItem" href="page-preflight.html"><i data-lucide="shield-check" aria-hidden="true"></i>Pre-flight</a></li>
        <li><a class="navItem" href="page-settings.html"><i data-lucide="settings" aria-hidden="true"></i>Settings</a></li>
      </ul>
      <div class="railFoot">
        <p class="creditsLine">Credits 82/100</p>
        <div role="progressbar" aria-label="Credits" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100" class="meterTrack">
          <div class="meterFill"></div>
        </div>
        <button type="button" class="upgrade" data-dead>Upgrade</button>
        <a href="#" class="footLink" data-dead>How credits work</a>
      </div>
    </nav>
    <main id="main-content" class="content">
      <div class="ambient" aria-hidden="true">
        <div class="ambientGlowTop"></div>
        <div class="ambientGlowBottom"></div>
      </div>
      <div class="col">
        <h1 class="listTitle">Templates</h1>
        <p class="countsLine">8 starters</p>
        <div class="searchWrap">
          <label class="searchLabel" for="template-search">Search templates</label>
          <input id="template-search" class="search" type="search" placeholder="Search templates..." autocomplete="off">
        </div>
        <div class="catPills" id="template-pills" role="group" aria-label="Filter templates by category"></div>
        <div class="grid" id="template-grid" role="list" aria-label="Template gallery"></div>
        <div class="empty" id="template-empty" hidden>
          <p class="emptyText">No templates match this search.</p>
          <button type="button" class="ghostAction" id="template-clear">Clear search</button>
        </div>
      </div>
    </main>
  </div>
  <script>
    var TEMPLATES = [
      { name: 'Welcome Wagon', category: 'welcome', desc: 'Post a friendly welcome message naming the new member within a minute of joining.' },
      { name: 'Mod Shield', category: 'moderation', desc: 'Delete messages with server-banned words and warn the author privately on first offense.' },
      { name: 'Ticket Desk', category: 'tickets', desc: 'Post a support panel with a button so members open a private ticket with one click.' },
      { name: 'Level Lounge', category: 'leveling', desc: 'Award experience for regular chat with a short cooldown so spam never farms levels.' },
      { name: 'Role Reactor', category: 'reaction-roles', desc: 'Post a role-picker message where reacting with an emoji grants the matching role.' },
      { name: 'Mod Log', category: 'logging', desc: 'Record edited and deleted messages with author, channel, and content for review.' },
      { name: 'Giveaway Grove', category: 'giveaways', desc: 'Start giveaways with a prize, duration, and winner count, then draw fairly at the end.' },
      { name: 'Coin Cellar', category: 'economy', desc: 'Grant coins for regular chat activity with a cooldown so idle spam never earns.' }
    ];
    var tplState = { category: 'all', query: '' };
    var gridEl = document.getElementById('template-grid');
    var emptyEl = document.getElementById('template-empty');
    var searchEl = document.getElementById('template-search');

    function tplCategories() {
      var cats = ['all'];
      TEMPLATES.forEach(function (t) {
        if (cats.indexOf(t.category) === -1) cats.push(t.category);
      });
      return cats;
    }

    function filteredTemplates() {
      var q = tplState.query.trim().toLowerCase();
      return TEMPLATES.filter(function (t) {
        if (tplState.category !== 'all' && t.category !== tplState.category) return false;
        if (q && t.name.toLowerCase().indexOf(q) === -1 && t.desc.toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
    }

    function renderTplPills() {
      var wrap = document.getElementById('template-pills');
      wrap.innerHTML = '';
      tplCategories().forEach(function (cat) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tab';
        b.textContent = cat === 'all' ? 'All' : cat;
        b.setAttribute('aria-pressed', tplState.category === cat ? 'true' : 'false');
        b.addEventListener('click', function () {
          tplState.category = cat;
          renderTemplates();
        });
        wrap.appendChild(b);
      });
    }

    function renderTemplates() {
      renderTplPills();
      gridEl.innerHTML = '';
      var list = filteredTemplates();
      list.forEach(function (t) {
        var card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('role', 'listitem');
        var top = document.createElement('div');
        top.className = 'cardTop';
        var name = document.createElement('h2');
        name.className = 'cardTitle';
        name.textContent = t.name;
        var pill = document.createElement('span');
        pill.className = 'pill';
        pill.textContent = t.category;
        top.appendChild(name);
        top.appendChild(pill);
        card.appendChild(top);
        var desc = document.createElement('p');
        desc.className = 'cardDesc';
        desc.textContent = t.desc;
        card.appendChild(desc);
        var btn = document.createElement('a');
        btn.href = '#';
        btn.className = 'ghostAction';
        btn.setAttribute('data-dead', '');
        btn.textContent = 'Configure';
        btn.addEventListener('click', function (e) { e.preventDefault(); });
        card.appendChild(btn);
        gridEl.appendChild(card);
      });
      if (list.length === 0) {
        gridEl.hidden = true;
        emptyEl.hidden = false;
      } else {
        gridEl.hidden = false;
        emptyEl.hidden = true;
      }
    }

    searchEl.addEventListener('input', function () {
      tplState.query = searchEl.value;
      renderTemplates();
    });
    document.getElementById('template-clear').addEventListener('click', function () {
      searchEl.value = '';
      tplState.query = '';
      tplState.category = 'all';
      renderTemplates();
      searchEl.focus();
    });
    document.querySelectorAll('[data-dead]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); });
    });
    renderTemplates();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
