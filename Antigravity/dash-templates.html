<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templates — Corvus (Design Preview)</title>
<meta name="description" content="Corvus templates design preview: starter gallery with category filter. Example data only.">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --bg:#000000; --card:#0d0d10; --line:#1c1c20; --line2:#2a2a30;
    --fg:#ffffff; --muted:#8a8a93; --muted2:#c9d1d9;
    --trial:#f59e0b; --pass:#22C55E; --focus:#3cc0ae;
  }
  html{ font-size:16px; }
  body{
    background:var(--bg); color:var(--fg);
    font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; color-scheme:dark;
  }
  .mono{ font-family:'Geist Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .strip{
    font-family:'Geist Mono',ui-monospace,monospace; font-size:12px; text-align:center;
    color:var(--muted); background:#0d0d10; border-bottom:1px solid var(--line); padding:8px 16px;
  }
  .shell{ display:flex; min-height:calc(100vh - 33px); }
  .rail{
    width:240px; flex:none; background:#000; border-right:1px solid var(--line);
    padding:16px 12px; display:flex; flex-direction:column; gap:16px;
    position:sticky; top:0; height:calc(100vh - 33px);
  }
  .workspace{ display:flex; align-items:center; gap:8px; padding:4px 8px; min-width:0; }
  .avatar-sm{
    width:28px; height:28px; flex:none; border-radius:50%; background:#262626; color:#fafafa;
    display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;
  }
  .ws-name{ font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pro{
    margin-left:auto; flex:none; font-size:12px; font-weight:500; padding:2px 10px; border-radius:999px;
    border:1px solid var(--line2); background:#111111; color:var(--muted2);
  }
  .navlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .navitem{
    display:flex; align-items:center; gap:10px; width:100%; padding:8px 12px; border-radius:999px;
    color:var(--muted); font-size:14px; font-weight:500; text-decoration:none;
    transition:background-color 200ms ease, color 200ms ease;
  }
  .navitem:hover{ background:#111111; color:#ffffff; }
  .navitem.active{ background:#262626; color:#fafafa; }
  .navitem svg{ width:14px; height:14px; flex:none; }
  .railfoot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding:16px 8px 0; }
  .creditsline{ margin:0; color:var(--muted2); font-size:13px; font-weight:500; }
  .meter{ height:4px; border-radius:999px; background:#262626; overflow:hidden; }
  .meter > div{ height:100%; width:82%; border-radius:inherit; background:#ffffff; }
  .upgrade{
    align-self:flex-start; padding:6px 16px; border-radius:999px; border:1px solid var(--line2);
    background:#262626; color:#fafafa; font-size:13px; font-weight:500; cursor:pointer;
  }
  .upgrade:hover{ background:#111111; border-color:var(--muted); }
  .main{ flex:1; min-width:0; padding:32px; display:flex; flex-direction:column; gap:20px; }
  .page-title{ margin:0; font-size:32px; line-height:38px; font-weight:700; letter-spacing:-0.01em; }
  .page-sub{ margin:4px 0 0; color:var(--muted); font-size:16px; line-height:24px; }
  .tray{
    background:rgb(255 255 255 / 0.08); border-radius:16px; padding:16px;
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    box-shadow:inset 0 1px 0 rgb(255 255 255 / 0.1);
    display:flex; flex-direction:column; gap:14px;
  }
  .field-label{ color:var(--muted2); font-size:15px; font-weight:600; }
  .search{
    height:48px; padding:0 20px; border-radius:999px; border:1px solid var(--line);
    background:#111111; color:#ffffff; font:inherit; font-size:15px; width:100%; max-width:520px;
  }
  .search::placeholder{ color:var(--muted); }
  .search:hover{ border-color:var(--line2); }
  .pills{ display:flex; gap:10px; flex-wrap:wrap; }
  .tabpill{
    height:44px; padding:0 20px; border-radius:999px; font-size:14px; font-weight:600;
    color:var(--muted); border:1px solid var(--line2); background:transparent; cursor:pointer;
    transition:background-color 200ms ease, color 200ms ease, border-color 200ms ease;
  }
  .tabpill:hover{ color:#ffffff; border-color:var(--muted); }
  .tabpill[aria-pressed="true"]{ background:#ffffff; color:#000000; border-color:#ffffff; }
  .count-line{ margin:0; color:var(--muted); font-size:14px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
  .tplcard{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px;
    display:flex; flex-direction:column; gap:12px;
  }
  .tpl-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tpl-name{ margin:0; font-size:18px; line-height:26px; font-weight:600; }
  .cat{
    display:inline-flex; align-items:center; flex:none; font-size:12px; font-weight:500;
    padding:2px 10px; border-radius:999px; border:1px solid var(--line2);
    background:#111111; color:var(--muted2); white-space:nowrap;
  }
  .tpl-desc{ margin:0; color:var(--muted); font-size:15px; line-height:24px; flex:1; }
  .btn-ghost{
    display:inline-flex; align-items:center; justify-content:center; height:46px; padding:0 24px;
    border-radius:999px; border:1px solid var(--line2); background:transparent; color:#fafafa;
    font-size:15px; font-weight:600; white-space:nowrap; cursor:pointer; text-decoration:none; align-self:flex-start;
  }
  .btn-ghost:hover{ background:#111111; border-color:var(--muted); }
  .empty{
    background:var(--card); border:1px solid var(--line2); border-radius:16px; padding:32px 24px;
    display:flex; flex-direction:column; gap:14px; align-items:flex-start;
  }
  .empty-text{ margin:0; color:#ffffff; font-size:16px; font-weight:500; }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  @media (max-width:1100px){
    .rail{ display:none; }
  }
</style>
</head>
<body>

<p class="strip">Design preview - example data.</p>

<div class="shell">
  <nav aria-label="Primary" class="rail">
    <div class="workspace">
      <span aria-hidden="true" class="avatar-sm">M</span>
      <span class="ws-name">My server</span>
      <span class="pro">Pro</span>
    </div>
    <ul class="navlist">
      <li><a class="navitem" href="dash-home.html"><i data-lucide="home"></i>Home</a></li>
      <li><a class="navitem" href="dash-bots.html"><i data-lucide="bot"></i>Bots</a></li>
      <li><a class="navitem active" aria-current="page" href="dash-templates.html"><i data-lucide="layout-template"></i>Templates</a></li>
      <li><a class="navitem" href="dash-bots.html#builder"><i data-lucide="messages-square"></i>Interview</a></li>
      <li><a class="navitem" href="dash-home.html#week"><i data-lucide="activity"></i>Activity</a></li>
      <li><a class="navitem" href="dash-bots.html#preflight"><i data-lucide="shield-check"></i>Pre-flight</a></li>
      <li><a class="navitem" href="dash-home.html#workspace"><i data-lucide="settings"></i>Settings</a></li>
    </ul>
    <div class="railfoot">
      <p class="creditsline mono">Credits 82/100</p>
      <div class="meter" role="progressbar" aria-label="Credits" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100"><div></div></div>
      <button type="button" class="upgrade" data-dead>Upgrade</button>
    </div>
  </nav>

  <main class="main">
    <div>
      <h1 class="page-title">Templates</h1>
      <p class="page-sub">8 starters. Pick one, make it yours.</p>
    </div>

    <div class="tray">
      <label class="field-label" for="template-search">Search templates</label>
      <input id="template-search" class="search" type="search" placeholder="Search templates..." autocomplete="off">
      <div id="template-pills" class="pills" role="group" aria-label="Filter templates by category"></div>
    </div>

    <p class="count-line mono" id="template-count" aria-live="polite"></p>
    <div id="template-grid" class="grid" role="list" aria-label="Template gallery"></div>
    <div id="template-empty" class="empty" hidden>
      <p class="empty-text">No templates match this search.</p>
      <button type="button" id="template-clear" class="btn-ghost">Clear search</button>
    </div>
  </main>
</div>

<script>
  var TEMPLATES = [
    { name: 'Welcome Wagon', category: 'welcome', desc: 'Post a friendly welcome message naming the new member within a minute of joining.' },
    { name: 'Mod Shield', category: 'moderation', desc: 'Delete messages with server-banned words and warn the author privately on first offense.' },
    { name: 'Ticket Desk', category: 'tickets', desc: 'Post a support panel with a button so members open a private ticket with one click.' },
    { name: 'Level Lounge', category: 'leveling', desc: 'Award experience for regular chat with a short cooldown so spam never farms levels.' },
    { name: 'Role Reactor', category: 'reaction-roles', desc: 'Post a role-picker message where reacting with an emoji grants the matching role.' },
    { name: 'Mod Log', category: 'logging', desc: 'Record edited and deleted messages with author, channel, and content for review.' },
    { name: 'Giveaway Grove', category: 'giveaways', desc: 'Start giveaways with a prize, duration, and winner count, then draw fairly at the end.' },
    { name: 'Coin Cellar', category: 'economy', desc: 'Grant coins for regular chat activity with a cooldown so idle spam never earns.' }
  ];

  var tplState = { category: 'all', query: '' };

  function tplCategories() {
    var cats = ['all'];
    TEMPLATES.forEach(function (t) {
      if (cats.indexOf(t.category) === -1) { cats.push(t.category); }
    });
    return cats;
  }

  function filteredTemplates() {
    var q = tplState.query.trim().toLowerCase();
    return TEMPLATES.filter(function (t) {
      if (tplState.category === 'all') {
        if (q === '') { return true; }
        return t.name.toLowerCase().indexOf(q) > -1 || t.desc.toLowerCase().indexOf(q) > -1;
      }
      if (t.category === tplState.category) {
        if (q === '') { return true; }
        return t.name.toLowerCase().indexOf(q) > -1 || t.desc.toLowerCase().indexOf(q) > -1;
      }
      return false;
    });
  }

  function renderTplPills() {
    var wrap = document.getElementById('template-pills');
    wrap.innerHTML = '';
    tplCategories().forEach(function (cat) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tabpill';
      b.textContent = cat === 'all' ? 'All' : cat;
      b.setAttribute('aria-pressed', tplState.category === cat ? 'true' : 'false');
      b.addEventListener('click', function () {
        tplState.category = cat;
        renderTemplates();
      });
      wrap.appendChild(b);
    });
  }

  function renderTemplates() {
    renderTplPills();
    var grid = document.getElementById('template-grid');
    var empty = document.getElementById('template-empty');
    var list = filteredTemplates();
    grid.innerHTML = '';
    list.forEach(function (t) {
      var card = document.createElement('div');
      card.className = 'tplcard';
      card.setAttribute('role', 'listitem');

      var top = document.createElement('div');
      top.className = 'tpl-top';
      var name = document.createElement('h2');
      name.className = 'tpl-name';
      name.textContent = t.name;
      var cat = document.createElement('span');
      cat.className = 'cat mono';
      cat.textContent = t.category;
      top.appendChild(name);
      top.appendChild(cat);
      card.appendChild(top);

      var desc = document.createElement('p');
      desc.className = 'tpl-desc';
      desc.textContent = t.desc;
      card.appendChild(desc);

      var btn = document.createElement('a');
      btn.href = '#';
      btn.className = 'btn-ghost';
      btn.setAttribute('data-dead', '');
      btn.textContent = 'Configure';
      btn.addEventListener('click', function (e) { e.preventDefault(); });
      card.appendChild(btn);

      grid.appendChild(card);
    });
    document.getElementById('template-count').textContent = 'Showing ' + list.length + ' of 8';
    if (list.length === 0) {
      grid.style.display = 'none';
      empty.removeAttribute('hidden');
    } else {
      grid.style.display = '';
      empty.setAttribute('hidden', '');
    }
  }

  var tSearch = document.getElementById('template-search');
  tSearch.addEventListener('input', function () {
    tplState.query = tSearch.value;
    renderTemplates();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (document.activeElement === tSearch) {
        tSearch.value = '';
        tplState.query = '';
        renderTemplates();
      }
    }
  });
  document.getElementById('template-clear').addEventListener('click', function () {
    tSearch.value = '';
    tplState.query = '';
    tplState.category = 'all';
    renderTemplates();
    tSearch.focus();
  });

  document.querySelectorAll('[data-dead]').forEach(function (el) {
    el.addEventListener('click', function (e) { e.preventDefault(); });
  });

  renderTemplates();
  if (window.lucide) { lucide.createIcons(); }
</script>
</body>
</html>
