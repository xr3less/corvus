<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvus — Card Garden preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        surface: '#0B0B0D',
        surface2: '#141417',
        card: '#16161B',
        panel: '#101014',
        text: '#FAFAFA',
        body: '#D4D1D9',
        muted: '#A1A1AA',
        faint: '#71717A',
        line: 'rgb(255 255 255 / 0.09)',
        linestrong: 'rgb(255 255 255 / 0.15)',
        primary: '#FAFAFA',
        primarytext: '#0A0A0B',
        accent: '#2DD4BF',
        live: '#22C55E',
        trial: '#F59E0B',
        offline: '#8a8a93'
      },
      fontFamily: {
        display: ['Poppins', 'system-ui', 'sans-serif'],
        body: ['system-ui', '-apple-system', 'Segoe UI', 'Inter', 'Arial', 'sans-serif'],
        mono: ['Geist Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
      }
    }
  }
};
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { background: #000000; }
  ::selection { background: rgba(45, 212, 191, 0.35); }
  .card-hover { transition: transform 160ms ease, border-color 160ms ease, background 160ms ease; }
  .card-hover:hover { transform: translateY(-2px); }
  :focus-visible { outline: 2px solid #2DD4BF; outline-offset: 3px; }
  input::placeholder { color: #71717A; }
  @media (max-width: 860px) {
    .rail-label { display: none; }
    .rail { width: 4.5rem; }
  }
</style>
</head>
<body class="font-body text-body antialiased">

<!-- Top strip (required) -->
<div class="w-full text-center text-[13px] tracking-wide py-2 border-b border-line bg-panel text-muted">
  Design preview - example data.
</div>

<div class="flex min-h-[calc(100vh-37px)]">

  <!-- Slim rail -->
  <aside class="rail w-60 shrink-0 border-r border-line bg-panel flex flex-col px-4 py-6 gap-2">
    <div class="flex items-center gap-3 px-2 pb-5">
      <span class="w-9 h-9 rounded-full bg-primary text-primarytext font-display font-semibold flex items-center justify-center text-lg leading-none">C</span>
      <span class="rail-label min-w-0">
        <span class="block font-display text-[15px] font-medium truncate text-text">My server</span>
        <span class="inline-block mt-1 font-mono text-[11px] font-medium tracking-widest uppercase text-muted bg-surface2 border border-linestrong rounded-full px-2 py-0.5">Pro</span>
      </span>
    </div>

    <nav class="flex flex-col gap-1" aria-label="Primary">
      <a href="#" data-dead class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14px] font-medium text-text bg-surface2 border border-line" aria-current="page">
        <i data-lucide="bot" class="w-[18px] h-[18px] text-muted"></i><span class="rail-label">Bots</span>
      </a>
      <a href="#" data-dead class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14px] text-muted card-hover hover:bg-card hover:text-text">
        <i data-lucide="layout-template" class="w-[18px] h-[18px]"></i><span class="rail-label">Templates</span>
      </a>
      <a href="#" data-dead class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14px] text-muted card-hover hover:bg-card hover:text-text">
        <i data-lucide="messages-square" class="w-[18px] h-[18px]"></i><span class="rail-label">Interview</span>
      </a>
      <a href="#" data-dead class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14px] text-muted card-hover hover:bg-card hover:text-text">
        <i data-lucide="activity" class="w-[18px] h-[18px]"></i><span class="rail-label">Activity</span>
      </a>
      <a href="#" data-dead class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14px] text-muted card-hover hover:bg-card hover:text-text">
        <i data-lucide="shield-check" class="w-[18px] h-[18px]"></i><span class="rail-label">Pre-flight</span>
      </a>
      <a href="#" data-dead class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14px] text-muted card-hover hover:bg-card hover:text-text">
        <i data-lucide="settings" class="w-[18px] h-[18px]"></i><span class="rail-label">Settings</span>
      </a>
    </nav>

    <a href="#" data-dead class="rail-label mt-3 mx-2 flex items-center gap-2 text-[13px] text-muted card-hover hover:text-text">
      <i data-lucide="sprout" class="w-4 h-4"></i>
      <span>Start from one of 8 starters</span>
    </a>

    <div class="mt-auto px-2 pt-5">
      <div class="rail-label rounded-xl border border-line bg-card p-4">
        <div class="flex items-center justify-between text-[13px]">
          <span class="text-muted">Credits</span>
          <span class="font-mono font-medium tabular-nums text-text">82 / 100</span>
        </div>
        <div class="mt-3 h-2 rounded-full bg-black overflow-hidden" role="progressbar" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100" aria-label="Credits used">
          <div class="h-full rounded-full bg-primary" style="width: 82%"></div>
        </div>
        <a href="#" data-dead class="mt-4 flex items-center justify-center gap-2 w-full rounded-lg bg-primary text-primarytext text-[14px] font-medium h-10">
          <i data-lucide="arrow-up" class="w-4 h-4"></i>Upgrade
        </a>
      </div>
    </div>
  </aside>

  <!-- Content -->
  <main class="flex-1 min-w-0 px-6 py-8 md:px-10 md:py-10">
    <div class="max-w-5xl mx-auto">

      <header class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="font-display text-[36px] md:text-[48px] leading-[1.25] tracking-[-0.03em] text-text font-medium">Your bots</h1>
          <p class="mt-2 text-muted text-[15px]">Pick a card to see its detail below.</p>
        </div>
        <div class="relative w-full sm:w-72">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-faint pointer-events-none"></i>
          <input id="search" type="search" placeholder="Search bots" aria-label="Search bots"
            class="w-full rounded-lg bg-black border border-line pl-10 pr-4 h-10 text-[14px] text-text focus:border-accent focus:outline-none">
        </div>
      </header>

      <div class="mt-6 flex gap-2" role="group" aria-label="Status filter" id="filters">
        <button data-filter="all" aria-pressed="true" class="rounded-full px-4 py-2 text-[13px] font-mono font-medium border border-linestrong bg-surface2 text-text">All</button>
        <button data-filter="live" aria-pressed="false" class="rounded-full px-4 py-2 text-[13px] font-mono font-medium border border-line text-muted card-hover hover:text-text">Live</button>
        <button data-filter="trial" aria-pressed="false" class="rounded-full px-4 py-2 text-[13px] font-mono font-medium border border-line text-muted card-hover hover:text-text">Trial</button>
      </div>

      <!-- Bot cards -->
      <section aria-label="Bots" class="mt-6">
        <div id="cards" class="grid gap-5 md:grid-cols-3"></div>
        <div id="empty" class="hidden rounded-xl border border-dashed border-line bg-card px-8 py-14 text-center">
          <div class="mx-auto w-12 h-12 rounded-full bg-surface2 border border-line flex items-center justify-center">
            <i data-lucide="search-x" class="w-5 h-5 text-muted"></i>
          </div>
          <h2 class="mt-4 font-display text-2xl font-semibold text-text">No bots match that search</h2>
          <p class="mt-2 text-muted text-[14px]">Try a different name.</p>
          <button id="clearSearch" class="mt-5 rounded-lg border border-linestrong px-5 h-10 text-[14px] font-medium text-text card-hover hover:bg-surface2">Clear search</button>
        </div>
      </section>

      <!-- Detail, stacked sections -->
      <section aria-label="Bot detail" id="detail" class="mt-10 flex flex-col gap-5"></section>

    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var BOTS = [
    { id: 'bot-1', name: 'Study Hall', status: 'online', statusLabel: 'Live', members: 1240, servers: 3, initials: 'SH' },
    { id: 'bot-2', name: 'Draft Arena', status: 'trial', statusLabel: 'Trial', members: 86, servers: 1, initials: 'DA' },
    { id: 'bot-3', name: 'Night Market mods', status: 'offline', statusLabel: 'Offline', members: 2013, servers: 2, initials: 'NM' }
  ];

  var TRIAL_LINE = 'Trial: 3 days, full Pro, no card. Then pay or your bot sleeps.';

  var PREFLIGHT = [
    { icon: 'check', text: 'Token and permissions look right' },
    { icon: 'check', text: 'Rate limits within caps' },
    { icon: 'eye', text: 'Welcome reply targets a hidden channel' }
  ];

  function activityFor(bot) {
    return [
      { text: 'Published ' + bot.name + ' v12', time: '2h ago' },
      { text: 'Simulated welcome flow', time: '5h ago' },
      { text: 'Rolled back ' + bot.name + ' to v11', time: 'yesterday' },
      { text: 'Published ' + bot.name + ' v11', time: '3d ago' }
    ];
  }

  function fmt(n) { return n.toLocaleString('en-US'); }
  function plural(n, one, many) { return fmt(n) + ' ' + (n === 1 ? one : many); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var state = { selectedId: 'bot-1', filter: 'all', query: '' };

  var cardsEl = document.getElementById('cards');
  var emptyEl = document.getElementById('empty');
  var detailEl = document.getElementById('detail');
  var searchEl = document.getElementById('search');
  var filtersEl = document.getElementById('filters');

  function statusDot(status) {
    if (status === 'online') return '<span class="w-2 h-2 rounded-full bg-live inline-block" aria-hidden="true"></span>';
    if (status === 'trial') return '<span class="w-2 h-2 rounded-full bg-trial inline-block" aria-hidden="true"></span>';
    return '<span class="w-2 h-2 rounded-full bg-offline inline-block" aria-hidden="true"></span>';
  }

  function pillText(status) {
    if (status === 'online') return 'text-live';
    if (status === 'trial') return 'text-trial';
    return 'text-offline';
  }

  function visibleBots() {
    var q = state.query.trim().toLowerCase();
    return BOTS.filter(function (b) {
      if (state.filter === 'live' && b.status !== 'online') return false;
      if (state.filter === 'trial' && b.status !== 'trial') return false;
      if (q && b.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function renderCards() {
    var list = visibleBots();
    var stillVisible = list.some(function (b) { return b.id === state.selectedId; });

    cardsEl.innerHTML = list.map(function (b) {
      var selected = b.id === state.selectedId;
      var trial = b.status === 'trial'
        ? '<p class="mt-4 rounded-lg bg-surface2 border border-line px-4 py-3 text-[13px] leading-relaxed text-muted">' + esc(TRIAL_LINE) + '</p>'
        : '';
      return '' +
        '<button data-select="' + b.id + '" aria-pressed="' + selected + '" class="card-hover text-left rounded-xl border p-7 ' +
          (selected ? 'bg-surface2 border-linestrong' : 'bg-card border-line hover:border-linestrong') + '">' +
          '<span class="flex items-start justify-between gap-3">' +
            '<span class="w-14 h-14 rounded-xl flex items-center justify-center font-display font-semibold text-xl ' +
              (selected ? 'bg-primary text-primarytext' : 'bg-black border border-line text-text') + '">' + esc(b.initials) + '</span>' +
            '<span class="flex items-center gap-2 rounded-full border border-line bg-black px-3 py-1.5 font-mono text-[12px] font-medium ' + pillText(b.status) + '">' +
              statusDot(b.status) + esc(b.statusLabel) +
            '</span>' +
          '</span>' +
          '<span class="block mt-5 font-display text-[26px] leading-snug font-semibold text-text">' + esc(b.name) + '</span>' +
          '<span class="block mt-2 text-[14px] text-muted">' + esc(plural(b.members, 'member', 'members')) + ' · ' + esc(plural(b.servers, 'server', 'servers')) + '</span>' +
          trial +
        '</button>';
    }).join('');

    emptyEl.classList.toggle('hidden', list.length !== 0);
    cardsEl.classList.toggle('hidden', list.length === 0);

    if (list.length > 0 && !stillVisible) state.selectedId = list[0].id;
    if (list.length === 0) { detailEl.innerHTML = ''; refreshIcons(); return; }
    renderDetail();
    refreshIcons();
  }

  function renderDetail() {
    var bot = BOTS.filter(function (b) { return b.id === state.selectedId; })[0] || BOTS[0];
    var rows = activityFor(bot);
    var trial = bot.status === 'trial'
      ? '<p class="rounded-xl bg-surface2 border border-line px-5 py-4 text-[14px] leading-relaxed text-muted">' + esc(TRIAL_LINE) + '</p>'
      : '';

    detailEl.innerHTML = '' +
      '<div class="rounded-xl border border-line bg-card p-7 md:p-9">' +
        '<div class="flex flex-wrap items-center gap-5">' +
          '<span class="w-16 h-16 rounded-xl bg-primary text-primarytext flex items-center justify-center font-display font-semibold text-2xl">' + esc(bot.initials) + '</span>' +
          '<span class="min-w-0 flex-1">' +
            '<span class="flex flex-wrap items-center gap-3">' +
              '<span class="font-display text-3xl font-semibold text-text">' + esc(bot.name) + '</span>' +
              '<span class="flex items-center gap-2 rounded-full border border-line bg-black px-3 py-1.5 font-mono text-[12px] font-medium ' + pillText(bot.status) + '">' + statusDot(bot.status) + esc(bot.statusLabel) + '</span>' +
            '</span>' +
            '<span class="block mt-1.5 text-[14px] text-muted">' + esc(plural(bot.members, 'member', 'members')) + ' · ' + esc(plural(bot.servers, 'server', 'servers')) + '</span>' +
          '</span>' +
          '<span class="flex flex-wrap gap-2">' +
            '<a href="#" data-dead class="rounded-lg bg-primary text-primarytext text-[14px] font-medium px-5 h-10 inline-flex items-center">Open</a>' +
            '<a href="#" data-dead class="rounded-lg border border-linestrong text-text text-[14px] font-medium px-5 h-10 inline-flex items-center card-hover hover:bg-surface2">Publish</a>' +
            '<a href="#" data-dead class="rounded-lg border border-linestrong text-text text-[14px] font-medium px-5 h-10 inline-flex items-center card-hover hover:bg-surface2">Rollback</a>' +
          '</span>' +
        '</div>' +
        (trial ? '<div class="mt-6">' + trial + '</div>' : '') +
      '</div>' +

      '<div class="rounded-xl border border-line bg-card p-7 md:p-9">' +
        '<h2 class="flex items-center gap-2.5 font-display text-[22px] font-semibold text-text"><i data-lucide="activity" class="w-5 h-5 text-muted"></i>Activity</h2>' +
        '<ul class="mt-5 flex flex-col">' +
          rows.map(function (r) {
            return '<li class="flex items-baseline justify-between gap-4 border-t border-line py-3.5 first:border-t-0 first:pt-0 last:pb-0 text-[14px]">' +
              '<span>' + esc(r.text) + '</span>' +
              '<span class="shrink-0 text-faint font-mono text-[13px]">' + esc(r.time) + '</span></li>';
          }).join('') +
        '</ul>' +
      '</div>' +

      '<div class="rounded-xl border border-line bg-card p-7 md:p-9">' +
        '<h2 class="flex items-center gap-2.5 font-display text-[22px] font-semibold text-text"><i data-lucide="shield-check" class="w-5 h-5 text-muted"></i>Pre-flight</h2>' +
        '<ul class="mt-5 flex flex-col gap-3">' +
          PREFLIGHT.map(function (r) {
            return '<li class="flex items-center gap-3 rounded-xl border border-line bg-black px-4 py-3.5 text-[14px]">' +
              '<i data-lucide="' + r.icon + '" class="w-[18px] h-[18px] shrink-0 text-muted"></i>' + esc(r.text) + '</li>';
          }).join('') +
        '</ul>' +
      '</div>' +

      '<div class="rounded-xl border border-line bg-card p-7 md:p-9">' +
        '<h2 class="flex items-center gap-2.5 font-display text-[22px] font-semibold text-text"><i data-lucide="pen-line" class="w-5 h-5 text-muted"></i>Change</h2>' +
        '<form id="composer" class="mt-5 flex flex-col sm:flex-row gap-3">' +
          '<input type="text" placeholder="Describe a change…" aria-label="Describe a change" ' +
            'class="flex-1 rounded-lg bg-black border border-line px-4 h-10 text-[14px] text-text focus:border-accent focus:outline-none">' +
          '<button type="submit" class="rounded-lg bg-primary text-primarytext text-[14px] font-medium px-6 h-10">Send</button>' +
        '</form>' +
      '</div>';
  }

  function refreshIcons() {
    if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
  }

  cardsEl.addEventListener('click', function (e) {
    var t = e.target.closest('[data-select]');
    if (!t) return;
    state.selectedId = t.getAttribute('data-select');
    renderCards();
  });

  filtersEl.addEventListener('click', function (e) {
    var t = e.target.closest('[data-filter]');
    if (!t) return;
    state.filter = t.getAttribute('data-filter');
    var btns = filtersEl.querySelectorAll('[data-filter]');
    Array.prototype.forEach.call(btns, function (b) {
      var on = b.getAttribute('data-filter') === state.filter;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.className = 'rounded-full px-4 py-2 text-[13px] font-mono font-medium border ' +
        (on ? 'border-linestrong bg-surface2 text-text' : 'border-line text-muted card-hover hover:text-text');
    });
    renderCards();
  });

  searchEl.addEventListener('input', function () {
    state.query = searchEl.value;
    renderCards();
  });

  document.getElementById('clearSearch').addEventListener('click', function () {
    searchEl.value = '';
    state.query = '';
    renderCards();
    searchEl.focus();
  });

  document.addEventListener('click', function (e) {
    var dead = e.target.closest('[data-dead]');
    if (dead) e.preventDefault();
  });

  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'composer') e.preventDefault();
  });

  renderCards();
  refreshIcons();
})();
</script>
</body>
</html>
