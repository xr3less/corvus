name: ci

on:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: corvus
          POSTGRES_PASSWORD: corvus_ci
          POSTGRES_DB: corvus_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd="pg_isready -U corvus -d corvus_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://corvus:corvus_ci@localhost:5432/corvus_ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrate (journaled runner over empty CI DB)
        run: node apps/gateway/scripts/migrate.mjs
      - name: Build spec contract (dist for workspace consumers)
        run: npm run build --workspace @corvus/spec
      - name: Build ai contract (dist for workspace consumers)
        run: npm run build --workspace @corvus/ai
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format
      - name: Test (incl. launch-blockers on real Postgres)
        run: npm test

  # Build-only Docker guard: no registry login, no push, no tags.
  #
  # Why it exists: the Dockerfiles copy an explicit list of source paths (the repo has
  # no root .dockerignore, so whole-directory copies would sweep in node_modules/ and
  # .env files). That list can drift — a path gets renamed or deleted and the copy
  # still names it — and the only thing that notices is a real build. Those builds
  # otherwise happen only on a manual deploy.yml run, so a broken image could sit on
  # master unnoticed. This job makes that drift fail fast on every push/PR.
  #
  # Path-filtered so docs-only and copy-only changes do not pay for a monorepo image
  # build; if the filter cannot decide, it builds (failing open toward more checking).
  # deploy.yml keeps its own push-capable build job — nothing here pushes to GHCR.
  docker-build:
    runs-on: ubuntu-latest
    needs: gates
    permissions:
      contents: read
      # paths-filter reads a PR's changed-file list through the REST API, which needs
      # this. Documented under "Supported workflows" in the action's README.
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: corvus-web
            dockerfile: apps/web/Dockerfile
          - image: corvus-gateway
            dockerfile: apps/gateway/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history, for paths-filter only. On pull_request it reads the changed-file
          # list from the REST API, but on push it shells out to git and diffs against the
          # commit before the push. checkout defaults to a 1-commit shallow clone, and the
          # documented failure mode there is a silent `false` for every filter — i.e. this
          # guard would quietly skip the very drift it exists to catch. The repo is small,
          # so the full clone is cheap. (On an unresolvable diff it falls back to treating
          # all files as added, which builds — failing open toward more checking.)
          fetch-depth: 0
      - name: Detect Docker-relevant changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - '**/Dockerfile'
              - 'package-lock.json'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'apps/**'
              - 'packages/**'
      - name: Set up Buildx
        if: steps.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build ${{ matrix.image }} (no push)
        if: steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Monorepo: context is the repo root so the Dockerfile can install the npm
          # workspaces (apps/*, packages/*) it depends on.
          context: .
          file: ${{ matrix.dockerfile }}
          # Stated explicitly even though it is the default: the whole point of this
          # job is that it can never publish. No login step exists to push with.
          push: false
          # Cache scopes are ci-prefixed so they cannot collide with deploy.yml's.
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
